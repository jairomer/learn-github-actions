# The name of the wokflow (optional)
name: learn-github-actions

# The name for the workflow runs generated from the workflow.
run-name: ${{ github.actor }} is learning GitHub Actions

# Specifies trigger for this workflow.
#  This example uses the "push" event, so a workflow run is triggered every time
#  someone pushes a change to the repository or merges a pull request.
#  This is triggered by a PUSH EVENT to every branch.
on: [push]

# Groups together all the steps that run in the leanr-github-actions workflow.
jobs:
  # Defines a job called "check-bats-version"
  check-bats-version:
    # The job will run on the latest version of an Ubuntu Linux runner.
    # This is a fresh virtual machine hosted by GitHub.
    # runs-on: ubuntu-latest
    runs-on: x64
    steps:
      # "uses" will specify that this step will run a certain "action"
      #
      #   Checksout your repository onto the runner, allowing you to run scripts or 
      #   other actions against your code, such as build and test tools.
      - uses: actions/checkout@v6
      #   Installs the specified version of NodeJs. Puts the node and npm commands
      #   in the PATH
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The "run" keyword tells the job to execute a command on the runner.
      # In this case, you are using "npm" to install the "bats" software testing
      # package.
      - run: npm install -g bats
      # Finally, run the "bats" command with a parameter that outputs the software
      # version.
      - run: bats -v
